<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11151d">
  <title>Night Idle</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">NIGHT IDLE</p>
        <h1>Dice Run</h1>
      </div>
      <div class="points-panel" aria-live="polite">
        <span class="points-label">Points</span>
        <strong id="pointsValue">0</strong>
      </div>
    </header>

    <section class="game-card roll-card" aria-labelledby="rollTitle">
      <div class="section-heading">
        <div>
          <p class="eyebrow">LANCER ACTIF</p>
          <h2 id="rollTitle">Tes dés</h2>
        </div>
        <div class="heading-actions">
          <button id="combosButton" class="icon-button" type="button" aria-haspopup="dialog">COMBOS</button>
          <div class="dice-count"><span id="diceCountValue">1</span>/6 dés</div>
        </div>
      </div>

      <div id="diceTray" class="dice-tray" aria-label="Tes dés et prochain dé à débloquer"></div>

      <div class="result-panel">
        <div>
          <span>Somme</span>
          <strong id="sumValue">—</strong>
        </div>
        <div>
          <span>Combinaison</span>
          <strong id="comboValue">Aucune</strong>
        </div>
        <div>
          <span>Multiplicateur</span>
          <strong id="multiplierValue">×1</strong>
        </div>
        <div class="gain-box">
          <span>Gain</span>
          <strong id="gainValue">+0</strong>
        </div>
      </div>

      <button id="rollButton" class="primary-button" type="button">LANCER</button>
    </section>

    <section class="stats-grid" aria-label="Statistiques">
      <article class="stat-card">
        <span>Lancers</span>
        <strong id="totalRollsValue">0</strong>
      </article>
      <article class="stat-card">
        <span>Points gagnés</span>
        <strong id="totalEarnedValue">0</strong>
      </article>
      <article class="stat-card">
        <span>Meilleur gain</span>
        <strong id="bestGainValue">0</strong>
      </article>
    </section>

    <footer class="footer-actions">
      <span>Sauvegarde locale automatique</span>
      <button id="resetButton" class="text-button" type="button">Réinitialiser la partie</button>
    </footer>
  </main>

  <dialog id="combosModal" class="modal" aria-labelledby="combosTitle">
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <p class="eyebrow">TABLE DES GAINS</p>
          <h2 id="combosTitle">Combinaisons</h2>
        </div>
        <button id="closeCombosButton" class="modal-close" type="button" aria-label="Fermer">×</button>
      </div>
      <div id="combosList" class="combos-list"></div>
    </div>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
